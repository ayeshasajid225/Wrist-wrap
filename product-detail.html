<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Detail</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
   <!-- JS LINK -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
          <link rel="stylesheet" href="assests/styling/navbar.css">
  <style>
    .btn{
      background-color: #285172;
      color: white;
    }
    .watch-img {
      max-height: 400px;
      object-fit: cover;
    }
  </style>
</head>
<body>
    <header></header>
  <!-- Load Watches Data -->
  <script src="assests/js/watch.js"></script>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const id = parseInt(urlParams.get("id"));
    const product = watches.find(w => w.id === id);

    if(product){
      document.getElementById("product-details").innerHTML = `
        <div class="col-md-6">
          <img src="${product.image}" alt="${product.name}" class="img-fluid watch-img shadow">
        </div>
        <div class="col-md-6">
          <h2>${product.name}</h2>
          <p><strong>Brand:</strong> ${product.brandName}</p>
          <p><strong>Price:</strong> ${product.price}</p>
          <p><strong>Movement:</strong> ${product.movement}</p>
          <p><strong>Dial Color:</strong> ${product.dialColor}</p>
          <p><strong>Bracelet:</strong> ${product.bracelet}</p>
          <p><strong>Origin:</strong> ${product.origin}</p>
          <p><strong>Available Colors:</strong> ${product.colors}</p>
          <p class="mt-3">${product.description}</p>
          <button class="btn mt-2">Add to Cart</button>
        </div>
      `;
    } else {
      document.getElementById("product-details").innerHTML = `<p>Watch not found.</p>`;
    }
  </script>

</body>
</html>


<script src="assests/js/navbar.js"></script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wrist Wrap - Watches</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
  <!-- jQuery -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="assests/styling/navbar.css">
  <style>
    .btn{
      background-color: #285172;
      color: white;
    }
    .watch-card img {
      height: 220px;
      object-fit: cover;
    }
  </style>
</head>
<body>

<header></header>
  <!-- Load Watches Data -->
  <script src="assests/js/watch.js"></script>

  <script>
    $(document).ready(function(){
      // Group watches by brand
      const brands = [...new Set(watches.map(w => w.brand))];
      const container = $("#watch-sections");

      brands.forEach(brand => {
        const brandWatches = watches.filter(w => w.brand === brand);

        let sectionHtml = `
          <h2 class="mt-5 text-capitalize">${brand}</h2>
          <div class="row">
        `;

        brandWatches.forEach(watch => {
          sectionHtml += `
            <div class="col-md-3 mb-4">
              <div class="card watch-card shadow">
                <img src="${watch.image}" class="card-img-top" alt="${watch.name}">
                <div class="card-body">
                  <h5 class="card-title">${watch.name}</h5>
                  <p class="card-text">${watch.price}</p>
                  <a href="product-detail.html?id=${watch.id}" class="btn btn-sm">View Details</a>
                </div>
              </div>
            </div>
          `;
        });

        sectionHtml += `</div>`;
        container.append(sectionHtml);
      });
    });
  </script>

</body>
</html>

<script src="assests/js/navbar.js"></script>
